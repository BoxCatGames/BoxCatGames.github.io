<p><strong>Effective Date:</strong> November 12, 2026</p>

<p>Cat Companion (“the app”) is a virtual cat pet app for Android made by Box Cat Games (“we”, “us”). This policy explains what the app does and doesn’t do with your information.</p>

<h3>The short version</h3>
<p>Cat Companion doesn’t collect, share, or sell your personal information. It has no accounts, no ads, and no analytics. Everything the app remembers stays on your device.</p>

<h3>What the app stores on your device</h3>
<p>The app saves your game progress locally: which cats you’ve adopted, the names you give them, their stats and care history, items and cosmetics, and your settings (such as dark mode). Our app does not send this data off your device, and we can’t see it. Uninstalling the app deletes it.</p>

<p>If Android’s backup feature is turned on for your device, Android and Google may back up app data to your Google account under Google’s own terms and privacy policy. We don’t control or receive those backups.</p>

<h3>Permissions the app uses</h3>
<ul>
<li>Display over other apps. Used only to draw your cat on top of other apps. The app does not read, capture, or record what is on your screen, and it can’t see what you do in other apps. Touches outside the cat go to the app underneath. You can turn this off at any time in Android Settings.</li>
<li>Notifications. Used to show a notification while your cat is out, with buttons to hide the cat or put it away.</li>
<li>Foreground service. Used to keep the cat on your screen while you’ve chosen to bring it out. A notification is always shown while it runs.</li>
</ul>

<h3>Information we don’t collect</h3>
<p>We don’t collect your name, email address, location, contacts, photos, microphone or camera data, advertising ID, or device identifiers. The app doesn’t include third-party advertising or analytics tools, and it doesn’t send your data to us or to anyone else.</p>

<h3>Information from Google Play</h3>
<p>If you install the app through Google Play, Google may provide us with aggregated crash and performance reports from users who have chosen to share diagnostics. These reports don’t identify you, and we use them only to fix bugs.</p>

<h3>Children’s privacy</h3>
<p>Because the app doesn’t collect personal information from anyone, it doesn’t knowingly collect personal information from children.</p>

<h3>Changes to this policy</h3>
<p>If the app changes in a way that affects your privacy (for example, by adding ads, analytics, or online features), we’ll update this policy and its effective date before that change is released.</p>

<h3>Contact Us</h3>
<p>If you have any questions regarding this policy, feel free to contact us via email at <strong>boxcatgamesdev@gmail.com</strong>.</p>
